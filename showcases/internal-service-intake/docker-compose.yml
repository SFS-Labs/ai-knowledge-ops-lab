services:
  n8n:
    image: n8nio/n8n:2.46.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PORT: 5678
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      APPROVAL_TOKEN: ${APPROVAL_TOKEN:?Set APPROVAL_TOKEN}
      INTERNAL_INTAKE_TOKEN: ${INTERNAL_INTAKE_TOKEN:?Set INTERNAL_INTAKE_TOKEN}
      MOCK_API_KEY: ${MOCK_API_KEY:?Set MOCK_API_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Keep the synthetic/local demo without unnecessary public REST API or third-party node installs.
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/opt/n8n-import:ro
    depends_on:
      - mock-api

  mock-api:
    build:
      context: ./mock-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MOCK_API_KEY: ${MOCK_API_KEY:?Set MOCK_API_KEY}
    command: ["python", "/app/app.py", "--db-path", "/data/intake.db", "--api-key", "${MOCK_API_KEY:?Set MOCK_API_KEY}"]
    volumes:
      - mock_api_data:/data

  # Activated only with --profile llm, so the original deterministic showcase remains unchanged.
  # The model is downloaded and SHA256-verified separately before starting Compose.
  model:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server-b12019@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389
    restart: "no"
    cpus: 3
    mem_limit: 6g
    ports:
      - "127.0.0.1:8081:8080"
    command:
      - "-m"
      - "/models/qwen.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "1024"
      - "--threads"
      - "3"
      - "--parallel"
      - "1"
      - "--n-gpu-layers"
      - "0"
    volumes:
      - ./model-cache:/models:ro

volumes:
  n8n_data:
  mock_api_data:
