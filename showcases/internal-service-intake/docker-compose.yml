services:
  n8n:
    image: n8nio/n8n:1.74.2
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-demo}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-demo-pass}
      INTERNAL_INTAKE_TOKEN: ${INTERNAL_INTAKE_TOKEN:-local-intake-token}
      MOCK_API_KEY: ${MOCK_API_KEY:-local-demo-api-key}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/opt/n8n-import:ro
    depends_on:
      - mock-api

  mock-api:
    build:
      context: ./mock-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MOCK_API_KEY: ${MOCK_API_KEY:-local-demo-api-key}
    command: ["python", "/app/app.py", "--db-path", "/data/intake.db", "--api-key", "${MOCK_API_KEY:-local-demo-api-key}"]
    volumes:
      - mock_api_data:/data

volumes:
  n8n_data:
  mock_api_data:
