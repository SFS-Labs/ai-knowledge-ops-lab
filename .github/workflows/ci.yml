name: ci

'on':
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  n8n-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          persist-credentials: false
      - name: Start local synthetic stack, import workflow and run n8n audit
        shell: bash
        working-directory: showcases/internal-service-intake
        run: |
          set -euo pipefail
          export INTERNAL_INTAKE_TOKEN="$(openssl rand -hex 32)"
          export APPROVAL_TOKEN="$(openssl rand -hex 32)"
          export MOCK_API_KEY="$(openssl rand -hex 32)"
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then docker compose logs --no-color --tail=120 n8n mock-api; fi; docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build -d
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5678/healthz >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker compose logs --no-color n8n; exit 1; fi
          docker compose exec -T n8n n8n import:workflow --input=/opt/n8n-import/workflow.internal-service-intake.v1.json
          docker compose exec -T n8n n8n audit
          docker compose exec -T n8n n8n update:workflow --all --active=true
          docker compose restart n8n
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5678/healthz >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker compose logs --no-color n8n; exit 1; fi
          intake='{"request_id":"REQ-E2E-001","requester":"synthetic","service_type":"analytics","urgency":"medium","justification":"Synthetic test request for review"}'
          approval='{"request_id":"REQ-E2E-001","approver":"reviewer","decision":"approve","rationale":"Synthetic demo approval"}'
          status=404
          for attempt in {1..20}; do
            status=$(curl --silent --show-error -o /tmp/sfs-intake-result.json -w '%{http_code}' -X POST http://127.0.0.1:5678/webhook/internal-service-intake -H "Content-Type: application/json" -H "X-INTAKE-TOKEN: $INTERNAL_INTAKE_TOKEN" -d "$intake")
            [ "$status" = 404 ] || break
            sleep 1
          done
          if [ "$status" != 200 ]; then echo "Intake webhook HTTP $status"; cat /tmp/sfs-intake-result.json; exit 1; fi
          jq -e '.request_id=="REQ-E2E-001" and .status=="pending"' /tmp/sfs-intake-result.json
          curl --fail-with-body --silent --show-error -X POST http://127.0.0.1:5678/webhook/internal-service-intake-approval -H "Content-Type: application/json" -H "X-APPROVAL-TOKEN: $APPROVAL_TOKEN" -d "$approval" | jq -e '.status=="applied"'
          curl --fail-with-body --silent --show-error http://127.0.0.1:8080/v1/intake/request/REQ-E2E-001 -H "X-MOCK-API-KEY: $MOCK_API_KEY" | jq -e '.request.status=="applied" and ([.audit[].event_type] | index("apply_executed") != null)'
