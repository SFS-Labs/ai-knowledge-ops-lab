name: Stage compiled Salesforce MCP for isolated Cloudflare deployment
on:
  push:
    branches: [feat/sfs-salesforce-remote-mcp]
    paths:
      - ".github/workflows/sfs-salesforce-bundle-stage.yml"

permissions:
  contents: write

jobs:
  stage-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned upstream
        run: |
          git clone https://github.com/tsmztech/salesforce-remote-mcp-cloudflare.git /tmp/sfs-salesforce-upstream
          git -C /tmp/sfs-salesforce-upstream checkout --detach 1924d34d73f5f883af13a257507f3fd2b92ffcb5
      - name: Apply SFS policy
        run: python3 salesforce-mcp-bootstrap/patch.py /tmp/sfs-salesforce-upstream
      - name: Build and test
        working-directory: /tmp/sfs-salesforce-upstream
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --outdir compiled
      - name: Stage compressed public-source bundle (no secrets)
        run: |
          gzip -n -9 -c /tmp/sfs-salesforce-upstream/compiled/index.js | base64 -w0 > salesforce-mcp-bootstrap/staged-worker.js.gz.b64
          sha256sum /tmp/sfs-salesforce-upstream/compiled/index.js | cut -d ' ' -f 1 > salesforce-mcp-bootstrap/staged-worker.sha256
          echo "" >> salesforce-mcp-bootstrap/staged-worker.js.gz.b64
          wc -c salesforce-mcp-bootstrap/staged-worker.js.gz.b64
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add salesforce-mcp-bootstrap/staged-worker.js.gz.b64 salesforce-mcp-bootstrap/staged-worker.sha256
          git commit -m "Temporary stage of reproducible Salesforce MCP worker build"
          git push origin HEAD:feat/sfs-salesforce-remote-mcp
