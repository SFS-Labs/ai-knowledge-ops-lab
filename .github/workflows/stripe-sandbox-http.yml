name: Stripe sandbox HTTP verification
'on':
  push:
    branches: [verify/stripe-sandbox-http]
    paths: [.github/workflows/stripe-sandbox-http.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sfs-stripe-sandbox-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/verify/stripe-sandbox-http'
    environment: stripe-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          persist-credentials: false
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Check source transformation and failure cleanup offline
        working-directory: showcases/hubspot-stripe-reconciliation
        run: python3 -m unittest -v test_sandbox_evidence
      - name: HubSpot-derived installments through unchanged direct Stripe HTTP CLI
        working-directory: showcases/hubspot-stripe-reconciliation
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: python3 verify_sandbox_http.py --output "$RUNNER_TEMP/stripe-evidence"
      - name: Retry restoration after a failure or cancellation
        if: failure() || cancelled()
        working-directory: showcases/hubspot-stripe-reconciliation
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: python3 verify_sandbox_http.py --restore-only --output "$RUNNER_TEMP/stripe-evidence"
      - name: Retain synthetic audit and verified metadata restoration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stripe-installment-http-evidence
          path: ${{ runner.temp }}/stripe-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Emit bounded synthetic evidence for durable review
        if: always()
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/stripe-evidence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIRECTORY'])
          for path in sorted(root.glob('*.json')):
              print('SFS_EVIDENCE ' + json.dumps({'file': path.name, 'data': json.loads(path.read_text())}, separators=(',', ':')))
          PY
