name: Stripe sandbox HTTP verification
'on':
  push:
    branches: [verify/stripe-sandbox-http]
    paths: [.github/workflows/stripe-sandbox-http.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/verify/stripe-sandbox-http'
    environment: stripe-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          persist-credentials: false
      - name: Verify real sandbox invoices without logging the response
        working-directory: showcases/hubspot-stripe-reconciliation
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/deals.csv" <<'CSV'
          deal_id,amount_minor,currency
          539978132699,100000,usd
          539935357174,200000,usd
          CSV
          python3 reconcile.py "$tmp/deals.csv" --audit "$tmp/audit.json" > "$tmp/results.json"
          python3 - "$tmp" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          audit = json.loads((root / "audit.json").read_text())
          results = json.loads((root / "results.json").read_text())
          assert audit["run_status"] == "complete" and audit["invoice_population"] == "pagination_completed"
          expected = [
              ("539978132699", ["in_1UamitE19wsOrukR7goJaSyd"], "invoice_draft", ["missing_invoice"]),
              ("539935357174", ["in_1UamioE19wsOrukRDWKzG9Qn"], "amount_mismatch", ["amount_mismatch", "missing_invoice"]),
          ]
          assert [(r["deal_id"], r["invoice_ids"], r["status"], r["alerts"]) for r in results] == expected, "Unexpected sandbox fixture results"
          print("PASS: direct Stripe HTTP, completed invoice listing, both synthetic deals matched, expected draft and amount alerts.")
          PY
